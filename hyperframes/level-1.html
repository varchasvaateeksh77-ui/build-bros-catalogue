<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HyperFrames Composition: Level 1, Digital menu (12s, 1200x900)</title>
  <style>
    body { margin: 0; width: 1200px; height: 900px; overflow: hidden; font-family: "Google Sans Flex", sans-serif; background: linear-gradient(180deg, #FFEEE3 0%, #FBA877 100%); color: #1A0C06; display: flex; flex-direction: column; justify-content: space-between; padding: 48px; box-sizing: border-box; }
    .tag { font-family: "Google Sans Code", monospace; font-size: 20px; background: #FFFFFF; color: #C03E0A; padding: 8px 16px; border-radius: 10px; width: fit-content; font-weight: 600; }
    .window { width: 520px; margin: auto; background: #FFFFFF; border-radius: 32px; padding: 36px; border: 2px solid #E3D9D3; }
    .caption { font-size: 44px; font-weight: 600; letter-spacing: -0.02em; }
  </style>
</head>
<body>
  <div class="tag">Demo</div>
  <div class="window">
    <div style="font-size: 28px; font-weight: 600; margin-bottom: 20px;">Table 5 · Digital menu</div>
    <div style="display: flex; justify-content: space-between; font-size: 24px; padding: 14px 0; border-bottom: 1px solid #E3D9D3;"><span>Flat white</span><span>3.50</span></div>
    <div style="display: flex; justify-content: space-between; font-size: 24px; padding: 14px 0;"><span>Smash burger</span><span>9.50</span></div>
  </div>
  <div class="caption" id="cap">A code on every table</div>
</body>
</html>
