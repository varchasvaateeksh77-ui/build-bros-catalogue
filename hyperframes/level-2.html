<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HyperFrames Composition: Level 2, Menu and waiter call (16s, 1200x900)</title>
  <style>
    body { margin: 0; width: 1200px; height: 900px; overflow: hidden; font-family: "Google Sans Flex", sans-serif; background: linear-gradient(180deg, #FFEEE3 0%, #FBA877 100%); color: #1A0C06; display: flex; flex-direction: column; justify-content: space-between; padding: 48px; box-sizing: border-box; }
    .tag { font-family: "Google Sans Code", monospace; font-size: 20px; background: #FFFFFF; color: #C03E0A; padding: 8px 16px; border-radius: 10px; width: fit-content; font-weight: 600; }
    .window { width: 580px; margin: auto; background: #FFFFFF; border-radius: 32px; padding: 36px; border: 2px solid #E3D9D3; }
    .btn { margin-top: 20px; background: #E8500C; color: #FBEFE6; padding: 18px; border-radius: 16px; text-align: center; font-size: 24px; font-weight: 600; }
    .caption { font-size: 44px; font-weight: 600; letter-spacing: -0.02em; }
  </style>
</head>
<body>
  <div class="tag">Demo</div>
  <div class="window">
    <div style="font-size: 28px; font-weight: 600; margin-bottom: 16px;">Waiter screen · Table 5</div>
    <div style="font-size: 22px; color: #6C625C;">Needs you, Table 5 · 2x Coffee, 1x Burger</div>
    <div class="btn">One button under the cart</div>
  </div>
  <div class="caption">The waiter gets the table number</div>
</body>
</html>
